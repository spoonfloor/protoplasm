<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Protoplasm</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Protoplasm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link
      rel="apple-touch-startup-image"
      href="icons/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="icons/splash-1179x2556.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="landing" class="landing">
      <div class="landing-surface">
        <div class="landing-ui-portal">
          <div class="landing-ui">
            <h1 class="landing-title">Protoplasm</h1>
            <p id="landing-meta" class="landing-meta" hidden></p>
            <div class="landing-actions">
              <button id="btn-continue" class="btn btn-primary" type="button" hidden>
                Continue
              </button>
              <button id="btn-select" class="btn btn-secondary" type="button">
                Choose File
              </button>
            </div>
            <p id="landing-hint" class="landing-hint">
              Double-tap with two fingers to exit to home screen.
            </p>
            <p id="landing-error" class="landing-error" hidden></p>
          </div>
        </div>
      </div>
    </div>

    <img id="screen" alt="" hidden />

    <input id="file-input" type="file" accept=".zip,application/zip" hidden />

    <script src="vendor/jszip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
